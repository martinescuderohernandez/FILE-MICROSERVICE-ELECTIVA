services:
  - type: web
    name: file-microservice
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        value: electiva-martin-jhonny-yefrey
      - key: B2_ENDPOINT_URL
        value: https://s3.us-east-005.backblazeb2.com
      - key: B2_REGION
        value: us-east-005
      - key: MAX_PHOTO_BYTES
        value: "5242880"
      - key: MAX_DOCUMENT_BYTES
        value: "20971520"
      - key: PRESIGNED_URL_TTL_SECONDS
        value: "300"
      - key: CORS_ORIGINS
        value: "*"
      - key: USER_SERVICE_ENABLED
        value: "false"
